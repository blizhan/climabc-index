name: Refresh Climate Data

on:
  schedule:
    - cron: '0 2 */5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Generate latest climate datasets
        run: |
          uv run climabc generate \
            --split-output-dir data

      - name: Commit and push updated datasets
        run: |
          if [[ -n "$(git status --porcelain -- data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore(data): refresh climate datasets ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No dataset changes detected."
          fi
